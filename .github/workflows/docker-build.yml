name: Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate icecast.xml for secret
        run: sed 's/xxxxxx/${{ secrets.ICECAST_SOURCE_PASSWORD }}/' icecast/icecast.xml.example > icecast/icecast.xml

    
      - name: Build Icecast Image
        uses: docker/build-push-action@v5
        with:
          context: icecast/
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
  
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Generate icecast.xml from secret
        run: sed 's/xxxxxx/${{ secrets.ICECAST_SOURCE_PASSWORD }}/' icecast/icecast.xml.example > icecast/icecast.xml

      - name: Start services
        run: docker compose up -d
        env:
          ICECAST_SOURCE_PASSWORD: ${{ secrets.ICECAST_SOURCE_PASSWORD }}

      - name: Wait for services to connect
        run: sleep 60

      - name: Check that the stream responds
        run: |
             set +e
             curl --max-time 2 -o /dev/null http://localhost:8000/radio.mp3
             exit_code=$?
             set -e
             if [ "$exit_code" = "0" ] || [ "$exit_code" = "28" ]; then
               echo "Le flux est OK (code $exit_code)"
             else
               echo "Le flux est KO (code $exit_code)"
               exit 1
             fi

      - name: Show Liquidsoap logs on failure
        if: failure()
        run: docker compose logs liquidsoap

      - name: check that API responds
        run: curl -f http://localhost:8001/now-playing

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api 

  build-api:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: api/
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}

  build-dj-ia:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push DJ-IA image
        uses: docker/build-push-action@v5
        with:
          context: dj-ia/
          push: true
          tags: ghcr.io/${{ github.repository }}-dj-ia:${{ github.sha }}
