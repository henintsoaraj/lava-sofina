name: Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate icecast.xml for secret
        run: sed 's/xxxxxx/${{ secrets.ICECAST_SOURCE_PASSWORD }}/' icecast/icecast.xml.example > icecast/icecast.xml

    
      - name: Build Icecast Image
        uses: docker/build-push-action@v5
        with:
          context: icecast/
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
  
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Generate icecast.xml from secret
        run: sed 's/xxxxxx/${{ secrets.ICECAST_SOURCE_PASSWORD }}/' icecast/icecast.xml.example > icecast/icecast.xml

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to connect
        run: sleep 10

      - name: Check that the stream responds
        run: curl -f --max-time 10 http://localhost:8000/radio.mp3
