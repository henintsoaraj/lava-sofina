name: Build Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate icecast.xml for secret
        run: sed 's/xxxxxx/${{ secrets.ICECAST_SOURCE_PASSWORD }}/' icecast/icecast.xml.example > icecast/icecast.xml

    
      - name: Build Icecast Image
        uses: docker/build-push-action@v5
        with:
          context: icecast/
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
